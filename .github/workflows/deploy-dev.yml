name: Deploy to DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=dev-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/imggen-backend:dev
            ${{ secrets.ACR_LOGIN_SERVER }}/imggen-backend:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Deploy Frontend to DEV SWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_BACKEND_URL }}
          NEXT_PUBLIC_ENV_LABEL: dev
        run: npm run build

      - name: Copy SWA config to output
        run: cp frontend/staticwebapp.config.json frontend/out/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DEV_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/out
          skip_app_build: true

  deploy-backend:
    name: Deploy Backend to DEV Container Apps
    runs-on: ubuntu-latest
    needs: build-backend

    env:
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/imggen-backend:${{ needs.build-backend.outputs.image-tag }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update backend Container App
        run: |
          az containerapp update \
            --name cae-imggen-dev-backend \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --image "$IMAGE" \
            --set-env-vars \
              "LEMON_SQUEEZY_API_KEY=${{ secrets.LEMON_SQUEEZY_API_KEY }}" \
              "LEMON_SQUEEZY_WEBHOOK_SECRET=${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}" \
              "LEMON_SQUEEZY_STORE_ID=${{ secrets.LEMON_SQUEEZY_STORE_ID }}"

      - name: Update celery-worker Container App
        run: |
          az containerapp update \
            --name cae-imggen-dev-celery-worker \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --image "$IMAGE" \
            --set-env-vars \
              "LEMON_SQUEEZY_API_KEY=${{ secrets.LEMON_SQUEEZY_API_KEY }}" \
              "LEMON_SQUEEZY_WEBHOOK_SECRET=${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}" \
              "LEMON_SQUEEZY_STORE_ID=${{ secrets.LEMON_SQUEEZY_STORE_ID }}"

      - name: Update celery-worker-clustering Container App
        run: |
          az containerapp update \
            --name cae-imggen-dev-celery-clustering \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --image "$IMAGE" \
            --set-env-vars \
              "LEMON_SQUEEZY_API_KEY=${{ secrets.LEMON_SQUEEZY_API_KEY }}" \
              "LEMON_SQUEEZY_WEBHOOK_SECRET=${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}" \
              "LEMON_SQUEEZY_STORE_ID=${{ secrets.LEMON_SQUEEZY_STORE_ID }}"

      - name: Update celery-worker-generation Container App
        run: |
          az containerapp update \
            --name cae-imggen-dev-celery-generation \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --image "$IMAGE" \
            --set-env-vars \
              "LEMON_SQUEEZY_API_KEY=${{ secrets.LEMON_SQUEEZY_API_KEY }}" \
              "LEMON_SQUEEZY_WEBHOOK_SECRET=${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}" \
              "LEMON_SQUEEZY_STORE_ID=${{ secrets.LEMON_SQUEEZY_STORE_ID }}"

      - name: Verify deployment
        run: |
          echo "Waiting for backend to become healthy..."
          BACKEND_URL="${{ secrets.DEV_BACKEND_URL }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy (attempt $i)"
              break
            fi
            echo "Waiting... (attempt $i, status: $STATUS)"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed after 5 minutes"
            exit 1
          fi

          # Verify a protected endpoint works (not just health)
          TOKEN=$(curl -s "$BACKEND_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"stuart.leal23@gmail.com","password":"password"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)

          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not obtain auth token for smoke test"
            exit 0
          fi

          STATS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BACKEND_URL/api/images/stats")
          if [ "$STATS_STATUS" != "200" ]; then
            echo "::error::/api/images/stats returned $STATS_STATUS — deployment may be broken"
            exit 1
          fi
          echo "Smoke test passed: /api/images/stats returned 200"

      # Note: Alembic migrations are NOT auto-run (az containerapp exec requires a TTY).
      # Run migrations manually when needed:
      #   az containerapp exec --name cae-imggen-dev-backend --resource-group rg-imggen-dev --command "alembic upgrade head"
