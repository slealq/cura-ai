[project]
name = "design-idea-pipeline"
version = "0.1.0"
description = "Design Idea Ingestion Pipeline - Automatically ingest, tag, and cluster design inspiration images"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "python-multipart>=0.0.6",
    "pillow>=10.2.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.3",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "imagehash>=4.3.1",
    "watchdog>=3.0.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "tenacity>=8.2.3",
    "umap-learn>=0.5.5",
    "fal-client>=0.5.0",
    "azure-storage-blob>=12.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
